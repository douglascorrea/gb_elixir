name: Bug report
description: Report a reproducible emulator, Phoenix, or documentation bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload commercial game ROMs, proprietary BIOS files, secrets, or private keys.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include exact commands, ROM type/license if relevant, and what you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Elixir/OTP versions, browser, and relevant env vars.
    validations:
      required: false
